name: CI/CD Pipeline - Old World Realms

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    # Veille quotidienne à 6h00 UTC
    - cron: "0 6 * * *"

env:
  NODE_VERSION: "20"

jobs:
  # 🔍 SURVEILLANCE QUALITÉ CODE
  code-quality:
    name: 📊 Analyse Qualité & Sécurité
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Type checking
        run: npm run type-check

      - name: 🧪 Run unit tests
        run: npm run test:coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: 🔒 Security audit
        run: npm audit --audit-level=moderate

      - name: 📦 Check for vulnerabilities
        run: npx audit-ci --moderate
        continue-on-error: true

  # 🎭 TESTS E2E
  e2e-tests:
    name: 🎭 Tests End-to-End
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps

      - name: 🏗️ Build application
        run: npm run build

      - name: 🧪 Run E2E tests
        run: npm run test:e2e

      - name: 📁 Upload test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # 🔍 SURVEILLANCE DÉPENDANCES
  dependency-check:
    name: 📦 Surveillance Dépendances
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check for outdated packages
        run: |
          npm outdated || true
          echo "## 📦 Packages à mettre à jour" >> $GITHUB_STEP_SUMMARY
          npm outdated --json || true >> outdated.json

      - name: 🚨 Dépendances critiques obsolètes
        run: |
          CRITICAL_UPDATES=$(npm outdated --parseable --depth=0 | grep -E "(vue|vite|typescript|playwright)" || true)
          if [ ! -z "$CRITICAL_UPDATES" ]; then
            echo "⚠️ Dépendances critiques à mettre à jour détectées"
            echo "$CRITICAL_UPDATES"
          fi

  # 🚀 BUILD & DÉPLOIEMENT
  build-deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    needs: [code-quality, e2e-tests]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build for production
        run: npm run build

      - name: 📊 Analyze bundle size
        run: |
          du -sh dist/
          echo "## 📊 Taille du bundle" >> $GITHUB_STEP_SUMMARY
          echo "$(du -sh dist/)" >> $GITHUB_STEP_SUMMARY
