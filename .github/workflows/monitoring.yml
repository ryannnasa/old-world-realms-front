name: 🔔 Surveillance & Alertes - Old World Realms

on:
  schedule:
    # Veille quotidienne à 8h00 UTC
    - cron: "0 8 * * *"
    # Veille hebdomadaire approfondie le dimanche
    - cron: "0 10 * * 0"
  workflow_dispatch:

jobs:
  # 🔍 SURVEILLANCE SÉCURITÉ
  security-monitoring:
    name: 🔒 Surveillance Sécurité
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Audit de sécurité détaillé
        run: |
          echo "## 🔒 Rapport de Sécurité" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnérabilités détectées :" >> $GITHUB_STEP_SUMMARY
          npm audit --json > audit.json || true

          # Analyse des vulnérabilités critiques
          CRITICAL=$(cat audit.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit.json | jq '.metadata.vulnerabilities.high // 0')
          MODERATE=$(cat audit.json | jq '.metadata.vulnerabilities.moderate // 0')

          echo "- 🔴 Critiques: $CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- 🟠 Élevées: $HIGH" >> $GITHUB_STEP_SUMMARY  
          echo "- 🟡 Modérées: $MODERATE" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt "0" ] || [ "$HIGH" -gt "0" ]; then
            echo "⚠️ Vulnérabilités critiques détectées !"
            exit 1
          fi

  # 📊 SURVEILLANCE PERFORMANCE
  performance-monitoring:
    name: 📊 Surveillance Performance
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build et analyse
        run: |
          npm run build

          echo "## 📊 Rapport de Performance" >> $GITHUB_STEP_SUMMARY
          echo "### Taille du bundle :" >> $GITHUB_STEP_SUMMARY

          # Analyse de la taille des fichiers
          TOTAL_SIZE=$(du -sb dist/ | cut -f1)
          TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE/1024/1024" | bc)

          echo "- 📦 Taille totale: ${TOTAL_SIZE_MB}MB" >> $GITHUB_STEP_SUMMARY

          # Vérification des seuils
          if (( $(echo "$TOTAL_SIZE_MB > 5.0" | bc -l) )); then
            echo "⚠️ Bundle trop volumineux (> 5MB)" >> $GITHUB_STEP_SUMMARY
          fi

          # Analyse des plus gros fichiers
          echo "### 📁 Plus gros fichiers :" >> $GITHUB_STEP_SUMMARY
          find dist/ -name "*.js" -o -name "*.css" | xargs ls -lah | sort -k5 -hr | head -5 >> $GITHUB_STEP_SUMMARY

  # 🧪 SURVEILLANCE TESTS
  test-monitoring:
    name: 🧪 Surveillance Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Exécution des tests avec métriques
        run: |
          echo "## 🧪 Rapport de Tests" >> $GITHUB_STEP_SUMMARY

          # Tests unitaires avec couverture
          npm run test:coverage > test-results.txt || true

          # Extraction des métriques
          COVERAGE=$(grep "All files" coverage/coverage-summary.json | grep -oP '(?<=statements":{"pct":)[^,]*' || echo "0")

          echo "### 📊 Couverture de code :" >> $GITHUB_STEP_SUMMARY
          echo "- 📈 Couverture globale: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

          # Alerte si couverture trop faible
          if (( $(echo "$COVERAGE < 65.0" | bc -l) )); then
            echo "⚠️ Couverture de code insuffisante (< 65%)" >> $GITHUB_STEP_SUMMARY
          fi

  # 🔔 NOTIFICATIONS
  notifications:
    name: 🔔 Notifications
    runs-on: ubuntu-latest
    needs: [security-monitoring, performance-monitoring, test-monitoring]
    if: failure()

    steps:
      - name: 📧 Envoi d'alerte
        run: |
          echo "🚨 ALERTE: Problème détecté dans la surveillance d'Old World Realms"
          echo "Veuillez vérifier les rapports de surveillance."
