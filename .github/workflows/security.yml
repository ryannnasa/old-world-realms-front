name: 🔒 Security Monitoring - Old World Realms

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    # Scan de sécurité quotidien à 2h00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  # 🔍 AUDIT DE SÉCURITÉ APPROFONDI
  security-audit:
    name: 🔒 Audit Sécurité Avancé
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 NPM Security Audit
        run: |
          echo "🔍 Audit NPM complet..."
          npm audit --audit-level=low --json > npm-audit.json || true
          npm audit --audit-level=moderate

      - name: 🛡️ Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --json-file-output=snyk-results.json

      - name: 🔍 OSV Scanner (Vulnérabilités Open Source)
        uses: google/osv-scanner-action@v1
        continue-on-error: true
        with:
          scan-args: |-
            -r
            --skip-git
            ./

      - name: 🚨 Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/vue

      - name: 🔐 GitGuardian Secret Scan
        uses: GitGuardian/ggshield-action@v1
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: 📊 Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            npm-audit.json
            snyk-results.json
            .semgrep/
          retention-days: 30

  # 🔍 ANALYSE LICENCE ET CONFORMITÉ
  license-compliance:
    name: 📜 Conformité Licences
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📜 License Checker
        run: |
          npx license-checker --json --out licenses.json
          npx license-checker --summary

      - name: 🔍 FOSSA License Scan
        uses: fossas/fossa-action@main
        continue-on-error: true
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

      - name: 📊 Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json

  # 🔍 SCAN CONTAINER DOCKER
  docker-security:
    name: 🐳 Sécurité Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: |
          if [ -f "Dockerfile" ]; then
            docker build -t old-world-realms:latest .
          else
            echo "⚠️ Pas de Dockerfile trouvé"
            exit 0
          fi

      - name: 🔒 Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: "old-world-realms:latest"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: 📊 Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  # 🚨 NOTIFICATION SÉCURITÉ
  security-notification:
    name: 🚨 Notifications Sécurité
    runs-on: ubuntu-latest
    needs: [security-audit, license-compliance]
    if: always() && (failure() || contains(needs.*.result, 'failure'))

    steps:
      - name: 🚨 Security Alert
        run: |
          echo "🚨 ALERTE SÉCURITÉ DÉTECTÉE"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Consultez les rapports de sécurité dans l'onglet Actions"

      - name: 📧 Send notification (si configuré)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 Alerte sécurité Old World Realms: Vulnérabilités détectées dans ${{ github.repository }}"}' \
            $SLACK_WEBHOOK_URL
